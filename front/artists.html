<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Артисты | Театр-студия "Школа Радости"</title>

    <link rel="stylesheet" href="/assets/css/body.css">
    <link rel="stylesheet" href="/assets/css/artists.css">
    
    <script>
        fetch('/assets/parts/header.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            });

        fetch('/assets/parts/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>
    <script src="/assets/js/header_menu_button.js" defer></script>
</head>
<body>
    <h1>Наши Артисты</h1>
    <div class="content">
        
        <div class="category">
            <h2>Студенческая группа</h2>
            <div class="carousel" id="junior-carousel"></div>
        </div>
        <div class="category">
            <h2>Старшая группа</h2>
            <div class="carousel" id="senior-carousel"></div>
        </div>
        <div class="category">
            <h2>Средняя группа</h2>
            <div class="carousel" id="middle-carousel"></div>
        </div>

        <script src="/assets/js/carousel_artists.js"></script>

    </div>
</body>
</html>
