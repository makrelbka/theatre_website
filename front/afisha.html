<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афиша | Театр-студия "Школа Радости"</title>

    <link rel="stylesheet" href="/assets/css/body.css">
    <link rel="stylesheet" href="/assets/css/afisha.css">


    <script>
      fetch('/assets/parts/header.html')
          .then(response => response.text())
          .then(data => {
              document.body.insertAdjacentHTML('afterbegin', data);
          });

      fetch('/assets/parts/footer.html')
          .then(response => response.text())
          .then(data => {
              document.body.insertAdjacentHTML('beforeend', data);
          });
    </script>

    <script src="/assets/js/header_menu_button.js" defer></script>
</head>
<body>
    <div class="content">
    <h1>АФИША</h1>
    <div class="event-container" id="eventContainer"></div>
  </div>
   <script>
let ticketsAvailable = {};

async function loadTickets() {
  try {
    const res = await fetch('/api/tickets');
    ticketsAvailable = await res.json();
  } catch (err) {
    console.error("Ошибка загрузки билетов с сервера:", err);
  }
}

const events = [
  {
    id: "event1",
    title: "ТУШЬ. ВАРЕНЬЕ. ПТЕРОДАКТИЛЬ.",
    date: "22 марта 2025",
    time: "14:00",
    place: "Основная сцена",
    price: 500,
    link: "/performances.html#section1",
    poster: "/assets/data/pics/posters/pterodactil.jpg"
  },
  {
    id: "event2",
    title: "КАРНАВАЛ ЗАВЕТНЫХ ЖЕЛАНИЙ",
    date: "22 декабря 2024",
    time: "14:00",
    place: "Основная сцена",
    price: 700,
    link: "performances.html#section3",
    poster: "/assets/data/pics/posters/carnival.jpg"
  },
  {
    id: "event3",
    title: "ГАНДИ МОЛЧАЛ ПО СУББОТАМ",
    date: "27 октября 2024",
    time: "14:00",
    place: "Основная сцена",
    price: 600,
    link: "performances.html#section2",
    poster: "/assets/data/pics/posters/gandi.jpg"
  }
];

function createEventHTML(event) {
  const available = ticketsAvailable[event.id] ?? 0;
  return `
    <div class="event">
      <a href="${event.link}" style="color: black; text-decoration: none;">
        <img src="${event.poster}" alt="${event.title}">
      </a>
      <div class="event-description">
        <h2><a href="${event.link}" style="color: black; text-decoration: none;">${event.title}</a></h2>
        <p>Дата: ${event.date}</p>
        <p>Время: ${event.time}</p>
        <p>Место: ${event.place}</p>
        <p>Осталось билетов: <span id="ticketCount${event.id}">${available}</span></p>
        <button class="ticket-btn" onclick="buyTicket('${event.id}', '${event.title}', '${event.date}', '${event.time}', ${event.price})">Купить билет</button>
      </div>
    </div>
  `;
}

function buyTicket(eventId, eventName, eventDate, eventTime, eventPrice) {
  if ((ticketsAvailable[eventId] ?? 0) > 0) {
    const purchaseData = { eventId, eventName, eventDate, eventTime, eventPrice };
    localStorage.setItem('currentPurchase', JSON.stringify(purchaseData));
    window.location.href = 'registration.html';
  } else {
    alert("Билеты закончились!");
  }
}

async function init() {
  await loadTickets();
  const container = document.getElementById("eventContainer");
  container.innerHTML = events.map(createEventHTML).join("");
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
