<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Запись на спектакль</title>

    <link rel="stylesheet" href="/assets/css/body.css" />
    <link rel="stylesheet" href="/assets/css/registration.css" />

    <script>
        fetch('/assets/parts/header.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('afterbegin', data);
            });

        fetch('/assets/parts/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>

    <script src="/assets/js/header_menu_button.js" defer></script>
    
 <body>
<div class="content">
    <h1>Запись на постановку</h1> 
    <h3 id="eventName">не указан</h3>
    <div class="registration-info">
        <h2>Для записи необходимо ввести ваши контактные данные</h2>

        <p><strong>Ваше ФИО:</strong> 
        <textarea id="fio" placeholder="Введите ФИО"></textarea>
        </p>
        <p><strong>Ваш номер телефона:</strong> 
        <textarea id="phone" placeholder="Введите номер"></textarea>
        </p>

        <p class="policy">
        <input type="checkbox" id="policyCheckbox">
        <label for="policyCheckbox">
            Я согласен с <a href="/privacy.html" target="_blank">Политикой конфиденциальности</a>
        </label>
        </p>

        <button id="submitBtn" onclick="sendRegistrationProof()">Отправить подтверждение</button>
    </div>
</div>

<!-- Модальное окно -->
<div id="confirmationModal" style="
    display:none; 
    position:fixed; 
    top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.5); 
    justify-content:center; align-items:center;">
    <div style="
        background:white; 
        padding:20px; 
        border-radius:10px; 
        max-width:400px; 
        text-align:left;">
        <h2>Регистрация успешна!</h2>
        <div id="modalContent"></div>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<script>
async function sendRegistrationProof() {
    const fio = document.getElementById('fio').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const checkbox = document.getElementById('policyCheckbox').checked;

    if (!fio || !phone || !checkbox) {
        alert("Заполните все поля и отметьте согласие с политикой конфиденциальности.");
        return;
    }

    const purchaseData = JSON.parse(localStorage.getItem('currentPurchase'));
    if (!purchaseData) {
        alert("Ошибка: нет данных о выбранном билете");
        return;
    }

    try {
        const response = await fetch('http://37.153.12.157:8081/api/buy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                eventId: purchaseData.eventId,
                fio,
                phone
            })
        });

        const result = await response.json();

        if (response.ok) {
            const content = `
                <p><strong>Событие:</strong> ${purchaseData.eventName}</p>
                <p><strong>Дата:</strong> ${purchaseData.eventDate}</p>
                <p><strong>Время:</strong> ${purchaseData.eventTime}</p>
                <p><strong>ФИО:</strong> ${fio}</p>
                <p><strong>Телефон:</strong> ${phone}</p>
                <p><strong>Цена:</strong> ${purchaseData.eventPrice}</p>
                <p><strong>Осталось билетов:</strong> ${result.ticketsLeft}</p>
            `;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('confirmationModal').style.display = 'flex';

            document.getElementById('fio').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('policyCheckbox').checked = false;
            localStorage.removeItem('currentPurchase');

        } else {
            alert(`Ошибка: ${result.error}`);
        }
    } catch (err) {
        console.error(err);
        alert("Ошибка связи с сервером");
    }
}

function closeModal() {
    document.getElementById('confirmationModal').style.display = 'none';
    window.location.href = '/afisha.html';
}
</script>

</html>
